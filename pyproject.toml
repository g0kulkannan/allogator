[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "allogator"
version = "1.0.0"
description = "Sequence-based allosteric residue prediction with ESM-1b attention"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Gokul R. Kannan"},
  {name = "C. Zheng"},
  {name = "Brian L. Hie"},
  {name = "Peter S. Kim"},
]
dependencies = [
  "numpy>=1.26,<2.3",
  "scipy>=1.11",
  "torch>=2.2",
  "fair-esm>=2.0.0",
]

[project.optional-dependencies]
replication = [
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "statsmodels>=0.14",
  "biopython>=1.83",
  "tqdm>=4.66",
  "transformers>=4.38",
  "sentencepiece>=0.2",
  "huggingface_hub>=0.20",
]

[project.scripts]
allogator = "allobench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["allobench"]
